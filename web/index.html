<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Derviq Control Plane</title><style>body{font-family:system-ui;background:#071016;color:#eef;padding:30px;max-width:1200px;margin:auto}input,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #334;background:#101a20;color:#fff}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{border:1px solid #263640;border-radius:14px;padding:16px;background:#0b151b}pre{white-space:pre-wrap;background:#030708;padding:15px;border-radius:10px;min-height:100px}</style></head><body><h1>Derviq Control Plane</h1><p>Live execution, policy enforcement and cryptographic evidence.</p><div class="card"><h2>API Access</h2><input id="key" type="password" placeholder="X-API-Key"><button onclick="saveKey()">Save Key</button><button onclick="location.href='/docs'">Open API Docs</button></div><div class="card"><h2>Control Lab</h2><div class="grid"><input id="agent" placeholder="Agent ID"><input id="owner" value="operator" placeholder="Owner"><input id="action" value="read" placeholder="Action"><input id="amount" type="number" value="0"><input id="risk" type="number" step="0.01" value="0"></div><button onclick="register()">Register Agent</button><button onclick="evaluate()">Evaluate</button><button onclick="evidence()">Write Evidence</button><button onclick="verify()">Verify DAG</button><pre id="out">Ready.</pre></div><div class="card"><h2>Runtime</h2><pre id="runtime">Loading…</pre></div><script src="/ui/app.js"></script></body></html>
