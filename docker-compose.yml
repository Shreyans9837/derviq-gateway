services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: derviq
      POSTGRES_USER: derviq
      POSTGRES_PASSWORD: derviq
    volumes:
      - derviq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derviq -d derviq"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  derviq_pg:
